# Not used yet, for proxy
host: 127.0.0.1
port: 8041
log_level: info

backends:
  - name: ollama_cloud
    type: ollama_cloud          # driver key, see DRIVERS below
    base_url: https://ollama.com/api
    api_key: ${OLLAMA_API_KEY}
    ctx_size: 32768
    timeout: 60

  - name: llamacpp
    type: llamacpp
    base_url: http://127.0.0.1:9931
    api_key: llama
    ctx_size: auto              # auto = discover via /props
    timeout: 120
    model: ""                   # empty = auto-resolve from /v1/models

  - name: koboldcpp
    type: koboldcpp
    base_url: http://127.0.0.1:5001
    ctx_size: auto              # discovers via /api/extra/true_max_context_length
    timeout: 120
    model: ""

  - name: ollama
    type: ollama
    base_url: http://127.0.0.1:5001
    ctx_size: auto              # discovers via /api/extra/true_max_context_length
    timeout: 120


  - name: openrouter
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    ctx_size: 128000
    rate_limits:
      tokens_per_minute: 100000
      requests_per_second: 10

  - name: mistral
    type: mistral               # base_url + ctx_size come from driver DEFAULTS
    api_key: $(MISTRAL_API_KEY)

  - name: aihorde
    type: aihorde
    api_key: ${AIHORDE_API_KEY}

routes:
  - path_prefix: /v1/chat/
    backend: local-llamacpp
    stream_mode: auto
  - path_prefix: /v1/models
    backend: local-llamacpp
    stream_mode: passthrough

default:
  round_robin: [local-llamacpp, ollama_cloud, mistral]