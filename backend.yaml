# Not used yet, for proxy
host: 127.0.0.1
port: 8041
log_level: info

backends:
  - name: ollama_cloud
    type: ollama_cloud # driver key
    base_url: https://ollama.com/api
    api_key: ${OLLAMA_API_KEY}
    ctx_size: 32768
    timeout: 60

  - name: llamacpp
    type: llamacpp
    base_url: http://127.0.0.1:9931/v1
    api_key: llama
    ctx_size: auto
    timeout: 120
    model: ""

  - name: koboldcpp
    type: koboldcpp
    base_url: http://127.0.0.1:5001
    api_key: kobold
    ctx_size: auto
    timeout: 120
    model: ""

  - name: ollama
    type: ollama
    base_url: http://127.0.0.1:11434/v1
    port: 11434
    api_key: ollama
    ctx_size: 8192
    timeout: 120

  - name: openrouter
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    ctx_size: 128000
    rate_limits:
      tokens_per_minute: 100000
      requests_per_second: 1

  - name: mistral
    type: mistral
    base_url: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY}
    ctx_size: 32000
    rate_limits:
      tokens_per_minute: 40000
      requests_per_second: 1

  - name: aihorde
    type: aihorde
    base_url: https://oai.aihorde.net/v1
    api_key: ${AIHORDE_API_KEY}
    ctx_size: auto
    rate_limits:
      tokens_per_minute: 100000
      requests_per_second: 1


