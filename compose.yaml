services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-sandbox:latest
    container_name: agent-sandbox-session
    network_mode: "host"
    # Todo: bridge is safer
    # network_mode: bridge
    # ports:
    #   - "3000-3010:3000-3010"
    working_dir: /workspace
    init: true
    cap_drop:
      - ALL
    security_opt:
      - seccomp=unconfined
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "reikon.lan:192.168.1.109"

    environment:
      - TERM=xterm-256color
      # Add your API keys here or in a .env file:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - OLLAMA_HOST=http://reikon.lan:11434
    # pids_limit: 100
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    # read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=100m
    volumes:
      - llmagent-workspace:/workspace
      - ./workspace:/mnt/workspace:rw,Z
      - ./agent:/agent:ro,Z
    stdin_open: true
    tty: true
    command: ["/bin/bash"]

volumes:
  llmagent-workspace:
    driver: local
